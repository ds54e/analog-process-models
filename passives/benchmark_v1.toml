schema = "apm.benchmark-passives.v1"
status = "v1-values-frozen-2026-08-30"

[calibration_basis]
date = "2026-08-30"
statement = "These intentionally synthetic, modest severities were selected after the common three-family MOS benchmark was operational. They are not extracted process-passive statistics."
ngspice_model_file = "passives/ngspice/benchmark_passives.inc"

[temperature]
reference_c = 27.0
tc1_units = "1/degC"
linear_law = "resolved_value(T)=resolved_value_at_27C*(1+tc1*(T-27C))"

[resistor]
public_name = "Rbench"
parameters = ["value", "tc1", "match_size"]
process_sigma = 0.02
process_sigma_units = "fractional_value_change"
mismatch_sigma_ref = 0.01
mismatch_sigma_ref_units = "fractional_value_change_at_match_size_1"
mismatch_scaling_law = "sigma_ref/sqrt(match_size)"
implementation = "resolved concrete SPICE resistor value"
positive_scale_semantic = "positive perturbation increases resolved resistance"

[capacitor]
public_name = "Cbench"
parameters = ["value", "tc1", "match_size"]
process_sigma = 0.02
process_sigma_units = "fractional_value_change"
mismatch_sigma_ref = 0.01
mismatch_sigma_ref_units = "fractional_value_change_at_match_size_1"
mismatch_scaling_law = "sigma_ref/sqrt(match_size)"
implementation = "resolved concrete SPICE capacitor value"
positive_scale_semantic = "positive perturbation increases resolved capacitance"

[variation]
process_scope = "global per passive class within one benchmark sample"
mismatch_scope = "local per APM passive instance"
process_vs_mismatch = "independent_by_default"
resistor_vs_capacitor_process = "independent_by_default"
composition = "multiplicative scale factors applied to nominal value before deterministic temperature scaling"
invalid_scale_factor = "must not be silently clipped; reject the resolved sample"

[requirements]
match_size_is_dimensionless = true
technology_neutral = true
native_passives_optional = true
explicit_sign_semantics = true
explicit_correlation_semantics = true
explicit_temperature_semantics = true
