[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "analog-process-models"
version = "1.0.0"
description = "Open analog compact-model technology kits and cross-process characterization framework"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "APM contributors" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "reuse>=5",
  "ruff>=0.6",
]

[project.scripts]
apm = "apm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
