schema = "apm.benchmark-adapters.v1"
status = "real-tool-calibrated-2026-08-30"

[method]
simulator = "ngspice 47"
temperature_c = 27.0
reference_length = "2*Lmin"
reference_vout = "0.5*VDD"
reference_vctrl = "nominal grid point nearest gm/Id=15 1/V"
vth_measurement = "constant-current threshold magnitude at VOUT=0.8*VDD"
vth_raw_sweep = [-0.04, 0.04]
drive_raw_multiplier_sweep = [0.8, 1.2]
fit_form = "observable_shift = linear*raw_delta + quadratic*raw_delta^2; mapping inverts this fit using the near-zero root"
canonical_vth_sign = "positive observable vth_shift means larger |Vth| for N and P"
canonical_drive_sign = "positive observable drive_shift means larger |Id| at the reference bias for N and P"
application = "resolved raw instance values are applied deterministically with ngspice alter commands before analysis"

[kit.apm130]
architecture = "planar_bulk"
compact_model = "psp103"
reference_l_m = 2.6e-7
reference_w_m = 1.0e-6
threshold_coefficient_a = 1.0e-7
threshold_normalization = "coefficient * W/L"
vdd_v = 1.2
vout_reference_v = 0.6
vth_raw_parameter = "delvto"
drive_raw_parameter = "factuo"
drive_raw_nominal = 1.0

[kit.apm130.n]
public_device = "apm130_nmos"
