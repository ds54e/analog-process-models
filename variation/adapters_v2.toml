schema = "apm.benchmark-adapters.v2"
status = "real-tool-calibrated-all-26-devices-2026-08-30"

[method]
simulator = "ngspice 47"
temperature_c = 27.0
required_family_count = 13
required_device_count = 26
reference_length = "2*device-specific Lmin"
reference_vout = "0.5*family-native VDD"
reference_vctrl = "nominal characterization grid point nearest gm/Id=15 1/V"
vth_measurement = "constant-current threshold magnitude at VOUT=0.8*family-native VDD"
vth_raw_sweep = [-0.04, 0.04]
drive_raw_multiplier_sweep = [0.8, 1.2]
fit_form = "observable_shift = linear*raw_delta + quadratic*raw_delta^2; resolver uses the near-zero inverse root"
canonical_vth_sign = "positive observable vth_shift means larger |Vth| for N and P"
canonical_drive_sign = "positive observable drive_shift means larger |Id| for N and P"
application = "resolved raw instance values are applied deterministically with ngspice alter commands"
calibration_evidence = "validation/evidence/v2_benchmark_adapters.json"
vth_fit_max_residual_acceptance_v = 1.0e-4
drive_fit_max_residual_acceptance_fraction = 1.0e-3

