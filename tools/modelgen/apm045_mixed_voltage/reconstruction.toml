schema = "apm.modelgen.reconstruction-input.v1"
kernel = "apm.modelgen.observable-kernel@1.2.0"
reference_simulator_major = 47
purpose = "Behavior-only reconstruction qualification; reference card parameters are not fitting inputs."
seeds = [41001, 41002, 41003]
starts_per_stage = 1
local_max_nfev = 45
sensitivity_fraction = 0.025
current_floor_a = 1.0e-10
current_log_tolerance_dec = 0.12
gmid_log_tolerance = 0.18
gdsid_log_tolerance = 0.25
cgg_log_tolerance = 0.20

[criteria]
calibration_objective_rms_max = 3.0
holdout_current_log_median_max_dec = 0.20
holdout_current_log_p95_max_dec = 0.60
holdout_threshold_error_p95_max_v = 0.10
holdout_gmid_log_p95_max = 0.70
holdout_gdsid_log_p95_max = 1.00
holdout_cgg_log_p95_max = 0.65
holdout_terminal_derivative_step_p95_max = 0.12
required_trend_agreement_fraction = 0.90

[fixed_parameters]
xj = 1.5e-8
ndep = 2.5e18
nsd = 1.0e20
k1 = 0.45
k2 = -0.03
dvt2 = -0.03
etab = -0.03
ub = 1.0e-18
rdswmin = 10.0
pdiblc2 = 0.0
delta = 0.01
fprout = 0.0
pdits = 0.0
cgbo = 0.0
xpart = 0.5
ckappad = 0.50
acde = 1.0
noff = 1.0
voffcv = 0.0
kt1l = 0.0
at = 0.0

