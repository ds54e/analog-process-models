wmax_m = 1.0e-4

[fixture.calibration]
temperatures_c = [-40, 27, 125]
length_ratios = [1.0, 4.0]
widths_um = [1.0]
idvg_fixed_bias_fractions = [0.0625, 0.50, 0.80]
idvd_fixed_bias_fractions = [0.55, 0.85]
points = 25

[fixture.holdout]
