schema = "apm.modelgen.mixed-voltage-generation.v1"
generation_epoch = 1
epoch_state = "SEALED_BEFORE_FINAL_CANDIDATE_GENERATION"
declared_date = "2026-09-04"
kernel = "apm.modelgen.observable-kernel@1.1.0"
reference_simulator_major = 47
purpose = "Independent APM-authored generic mixed-voltage BSIM4 synthesis from public qualitative evidence and APM-selected observable contracts."
parameter_source = "APM engineering choices within declared bounds; no foundry or private card parameters"
seeds = [52001, 52002, 52003, 52004, 52005]
minimum_retained_candidates_per_family = 3
canonical_selection = "observable_space_medoid"
card_dialect = "BSIM4 4.8.2"
# Every seeded draw is bounded about its family/polarity center. A failed
# stage may shrink only the newly released normalized displacement toward the
# center using these predeclared refinement factors.
stage_refinement_factors = [1.0, 0.75, 0.50, 0.25, 0.0]
local_sensitivity_fraction_of_span = 0.10

[claim_boundary]
foundry_correlated = false
silicon_calibrated = false
reliability_qualified = false
foundry_geometry_rules = false
manufacturable_pdk = false
layout_dependent_charge = false
process_noise_calibrated = false

