[selection]
method = "observable_space_medoid"
metric_names = ["vth", "dibl", "id_per_width_vs_gmid", "gds_over_id", "gm_over_gds", "cgg_per_width_or_area", "cgd_over_cgg", "body_effect", "temperature"]
normalization = "median_absolute_deviation_with_unit_floor"
tie_break = "lowest_seed"
circuit_results_available_before_selection = true

[failure_states]
io25 = "IO25_CONTRACT_INCONSISTENT"
io18 = "IO18_CONTRACT_INCONSISTENT"
