identifiability = "PARAMETER_IDENTIFIABILITY_FAILURE"
ensemble = "EPISTEMIC_UNCERTAINTY_TOO_WIDE"
dc_charge = "DC_CHARGE_CONFLICT"
circuit = "CIRCUIT_HOLDOUT_FAILURE"
