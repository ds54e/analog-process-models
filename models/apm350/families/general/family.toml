schema = "apm.family.v2"
technology_id = "apm350"
id = "general"
architecture = "planar_bulk"
compact_model = "bsim3"
gate_stack_id = "legacy"
gate_stack_class = "legacy_single"
threshold_class = "general"
origin = "apm_authored"
typical_uses = ["legacy_analog", "educational_comparison"]
default_operating_profile = "nominal"
provenance = "models/apm350/provenance.toml"
backend_bindings = ["models/apm350/families/general/ngspice/binding.toml", "models/apm350/families/general/spectre/binding.toml"]

[[operating_profile]]
id = "nominal"
reference_vdd_v = 5.0
origin = "upstream_class_evidence"
purpose = "release characterization"
evidence = "The pinned SCN4M_SUBM class description identifies 5 V operation."
temperatures_c = [-40, 27, 85, 125]

[[device]]
id = "nmos"
polarity = "n"
public_name = "apm350_general_nmos"
terminals = ["d", "g", "s", "b"]
geometry_kind = "planar"
parameters = ["w", "l"]
lmin_m = 4.0e-7
lmax_m = 1.0e-5
wmin_m = 6.0e-7
wmax_m = 1.0e-4
default_w_m = 1.0e-6
characterization_lengths_m = [4.0e-7, 8.0e-7, 1.6e-6]

[[device]]
id = "pmos"
polarity = "p"
public_name = "apm350_general_pmos"
terminals = ["d", "g", "s", "b"]
geometry_kind = "planar"
parameters = ["w", "l"]
lmin_m = 4.0e-7
lmax_m = 1.0e-5
wmin_m = 6.0e-7
wmax_m = 1.0e-4
default_w_m = 1.0e-6
characterization_lengths_m = [4.0e-7, 8.0e-7, 1.6e-6]

[threshold]
method = "constant_current"
coefficient_a = 1.0e-7
normalization = "coefficient * W/L"
vout_low_v = 0.05
vout_high_fraction_vdd = 0.8

[characterization]
idvg_points = 251
idvd_points = 251
y_frequencies_hz = [1.0e5, 1.0e6]

[behavior_targets]
nominal_lmin_vth_magnitude_v = [0.35, 0.90]
nominal_lmin_dibl_v_per_v = [0.0, 0.08]
nominal_lmin_gm_over_gds_at_gm_over_id_15 = [15.0, 250.0]
nominal_lmin_on_current_n_a_per_um = [2.0e-4, 3.0e-3]
nominal_lmin_on_current_p_a_per_um = [1.0e-4, 2.0e-3]
length_scaling_requires_lower_dibl_and_higher_intrinsic_gain = true
length_scaling_requires_higher_vth = true
