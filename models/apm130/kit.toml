schema = "apm.kit.v1"
id = "apm130"
technology_class = "130nm"
architecture = "planar_bulk"
compact_model = "psp103"
nominal_vdd_v = 1.2
model_lmin_m = 1.3e-7
default_w_m = 1.0e-6
default_l_m = 1.3e-7
characterization_lengths_m = [1.3e-7, 2.6e-7, 5.2e-7]
temperatures_c = [-40, 27, 85, 125]

[supply_basis]
source = "IHP-Open-PDK README at pinned revision"
statement = "The SG13G2 thin-gate-oxide device is identified as the 1.2 V digital-logic device."

[geometry_basis]
source = "IHP cornerMOSlv.lib at pinned revision"
valid_l_m = [1.3e-7, 1.0e-5]
valid_w_m = [1.5e-7, 1.0e-5]

[public_devices]
n = "apm130_nmos"
p = "apm130_pmos"
terminals = ["d", "g", "s", "b"]
parameters = ["w", "l"]

[threshold]
method = "constant_current"
planar_current_coefficient_a = 1.0e-7
normalization = "Id criterion = coefficient * W/L"
vout_low_v = 0.05
vout_high_fraction_vdd = 0.8

[characterization]
idvg_points = 61
idvd_points = 61
gm_gds_relative_perturbations = [0.01, 0.02]
y_frequencies_hz = [1.0e5, 1.0e6]
terminal_order = ["d", "g", "s", "b"]
