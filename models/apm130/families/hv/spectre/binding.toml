schema = "apm.backend-binding.v2"
technology_id = "apm130"
family_id = "hv"
backend = "spectre"
compact_model_native_name = "PSP103"
model_includes = ["models/apm130/spectre/sg13g2_hv_psp103_tt.sp"]
wrapper = "models/apm130/families/hv/spectre/model.scs"
native_oracle = "unverified Spectre native PSP103 mapping"
status = "experimental_unverified"
real_tool_validation = false
include_language = "spice"
instance_prefix = "M"

[device.nmos]
native_vector_template = "unavailable_model_only"
native_model = "sg13g2_hv_nmos_psp"
fixed_parameters = "nf=1 as=w*340n ad=w*340n ps=2*(w+340n) pd=2*(w+340n) ngcon=2"

[device.pmos]
native_vector_template = "unavailable_model_only"
native_model = "sg13g2_hv_pmos_psp"
fixed_parameters = "nf=1 as=w*340n ad=w*340n ps=2*(w+340n) pd=2*(w+340n) ngcon=2"
