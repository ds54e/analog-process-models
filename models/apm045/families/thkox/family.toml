schema = "apm.family.v2"
technology_id = "apm045"
id = "thkox"
architecture = "planar_bulk"
compact_model = "bsim4"
gate_stack_id = "thick_oxide"
gate_stack_class = "thick"
threshold_class = "standard"
origin = "upstream_model"
upstream_flavor = "THKOX"
typical_uses = ["high_voltage_off_chip_io"]
default_operating_profile = "nominal"
provenance = "models/apm045/provenance.toml"
backend_bindings = ["models/apm045/families/thkox/ngspice/binding.toml", "models/apm045/families/thkox/spectre/binding.toml"]

[[operating_profile]]
id = "nominal"
reference_vdd_v = 2.0
origin = "apm_selected"
purpose = "release characterization"
evidence = "The pinned manual identifies THKOX only as high-voltage off-chip I/O and gives no nominal VDD. APM selects 2.0 V because real terminal sweeps turn both 1.45-1.51 V-threshold cards on with stable finite-difference/Y behavior, while 2.5 V and 3.3 V exposed non-monotonic or convergence failures in the release envelope; this is not an upstream voltage or reliability claim."
temperatures_c = [-40, 27, 85, 125]

[[operating_profile]]
id = "common_overlap_1v0"
reference_vdd_v = 1.0
origin = "apm_selected"
purpose = "APM045 VTG/THKOX common-overlap gate-stack comparison"
evidence = "1.0 V is the VTG native profile and a conservative terminal-model bias for the thicker-oxide card; it is explicitly a behavior comparison, not a reliability rating."
temperatures_c = [-40, 27, 85, 125]

[[device]]
id = "nmos"
polarity = "n"
public_name = "apm045_thkox_nmos"
terminals = ["d", "g", "s", "b"]
geometry_kind = "planar"
parameters = ["w", "l"]
lmin_m = 5.0e-8
lmax_m = 1.0e-6
wmin_m = 9.0e-8
wmax_m = 1.6e-5
default_w_m = 1.0e-6
characterization_lengths_m = [5.0e-8, 1.0e-7, 2.0e-7]

[[device]]
id = "pmos"
polarity = "p"
public_name = "apm045_thkox_pmos"
terminals = ["d", "g", "s", "b"]
geometry_kind = "planar"
parameters = ["w", "l"]
lmin_m = 5.0e-8
lmax_m = 1.0e-6
wmin_m = 9.0e-8
wmax_m = 1.6e-5
default_w_m = 1.0e-6
characterization_lengths_m = [5.0e-8, 1.0e-7, 2.0e-7]

[threshold]
method = "constant_current"
coefficient_a = 1.0e-7
normalization = "coefficient * W/L"
vout_low_v = 0.05
vout_high_fraction_vdd = 0.8

[characterization]
idvg_points = 201
idvd_points = 101
y_frequencies_hz = [1.0e5, 1.0e6]
dibl_validation_max_v_per_v = 0.70
