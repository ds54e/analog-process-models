[[evidence]]
id = "umc-55-65-90-io-offerings"
title = "UMC 55/65/90 nm technology device offerings"
source_kind = "official_foundry"
source_locator = "https://www.umc.com/en/Product/technologies/Detail/55_65_90nm"
observed_fact = "UMC publicly lists separate 55 nm-class core platforms and I/O offerings including 2.5 V and 2.5 V-underdriven-at-1.8 V device classes."
confidence = "high"
allowed_use = [
  "Establish that distinct core and 2.5 V-class I/O device offerings exist in a public neighboring-node technology class.",
  "Motivate a separately labeled common 1.8 V underdrive comparison for a generic 2.5 V-class APM family.",
]
forbidden_use = [
  "Do not infer or copy any UMC compact-model parameter, geometry rule, electrical target, reliability rating, or correlation claim.",
  "Do not describe io18 or io25 as UMC devices or as compatible with a UMC PDK.",
]

[[evidence]]
id = "berkeley-bsim4-release"
title = "UC Berkeley BSIM4 model and release archive"
source_kind = "standards_document"
source_locator = "https://www.bsim.berkeley.edu/models/bsim4/"
observed_fact = "The UC Berkeley BSIM Group identifies BSIM4 as a bulk-MOSFET compact model used at 45/40 nm and lists BSIM4 4.8.2 as a released version dated 2020-01-01."
confidence = "high"
allowed_use = [
  "Use BSIM4 parameter semantics and the already qualified 4.8.2 card dialect for independently authored APM models.",
  "Use documented BSIM4 defaults only when the generation record makes that dependency explicit.",
]
forbidden_use = [
  "Do not treat BSIM4 defaults as measurements of a 45/55 nm process.",
  "Do not infer a foundry technology, voltage rating, geometry rule, or calibration from compact-model availability.",
