version = 1

[[annotations]]
path = [
  "README.md",
  "GOAL.md",
  "AGENTS.md",
  "UNATTENDED_EXECUTION.md",
  "STATUS.md",
  "THIRD_PARTY.md",
  ".gitignore",
  "pyproject.toml",
  "src/**",
  "variation/**",
  "passives/**",
  "validation/**",
  "examples/**",
  "tools/**",
  "tests/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "APM contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored model files are intentionally NOT covered by this aggregate annotation.
# Add file-level or narrowly scoped directory annotations only after exact upstream
# license/provenance audit. Do not use this file to overwrite upstream licensing.
