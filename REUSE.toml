version = 1

[[annotations]]
path = [
  "README.md",
  "GOAL.md",
  "AGENTS.md",
  "PROJECT_CONTEXT.md",
  "ENVIRONMENT.md",
  "RESEARCH_BASELINE.md",
  "RESULT_CONTRACT.md",
  "UNATTENDED_EXECUTION.md",
  "STATUS.md",
  "CHANGELOG.md",
  "THIRD_PARTY.md",
  ".gitignore",
  "pyproject.toml",
  "src/**",
  "variation/**",
  "passives/**",
  "validation/**",
  "examples/**",
  "tools/**",
  "tests/**",
  "models/*/provenance.toml"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "APM contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["models/apm130/vendor/psp103/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "NXP Semiconductors",
  "Delft University of Technology",
  "Commissariat a l'energie atomique et aux energies alternatives (CEA)"
]
SPDX-License-Identifier = "LicenseRef-Si2-PSP-103.8.2"

[[annotations]]
path = ["models/apm130/vendor/ihp-sg13g2-models/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 IHP PDK Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["models/apm016f/vendor/bsim-cmg-112.1.0/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 University of California"
SPDX-License-Identifier = "ECL-2.0"

